name: CI & Production Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test Suite (Rust & Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
          pip install --upgrade pip
          pip install maturin pytest httpx psutil fastapi uvicorn numpy pydantic

      - name: Lint & Verify Standalone Server Build
        run: |
          rustup component add clippy
          cargo clippy --no-default-features --bin sutradb-server -- -D warnings
          cargo clippy --all-targets -- -D warnings
          cargo build --release --no-default-features --bin sutradb-server

      - name: Run Rust Tests
        run: cargo test --release --verbose

      - name: Build Local Wheel & Run Pytest
        run: |
          pip install --no-build-isolation .
          python -c "import sys, pathlib, shutil; sys.path = [p for p in sys.path if p not in ('', '.')]; import sutradb._sutradb as m; shutil.copy2(m.__file__, pathlib.Path('sutradb') / pathlib.Path(m.__file__).name)"
          pytest -v

  build-wheels:
    name: Build Wheels (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build wheels via Maturin
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist

      - name: Build sdist
        if: matrix.os == 'ubuntu-latest'
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Upload Wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build-wheels]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sutradb-core
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

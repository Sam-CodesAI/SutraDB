services:
  sutradb:
    build:
      context: .
      dockerfile: Dockerfile
    image: sutradb:latest
    container_name: sutradb-server
    restart: unless-stopped
    ports:
      - "50051:50051" # Binary gRPC High-Throughput Engine
      - "8765:8765"   # REST API & Bento Grid Management Console
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - SUTRA_MODE=all
      - SUTRA_HOST=0.0.0.0
      - SUTRA_GRPC_PORT=50051
      - SUTRA_REST_PORT=8765
      - SUTRA_DATA_DIR=/data
    volumes:
      - sutra_storage:/data
    deploy:
      resources:
        limits:
          memory: 4096M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "python3", "/usr/local/bin/sutra-healthcheck.py"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  sutra_storage:
    driver: local

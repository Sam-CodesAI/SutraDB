apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sutradb
  namespace: sutradb
  labels:
    app.kubernetes.io/name: sutradb
spec:
  serviceName: sutradb-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sutradb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sutradb
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sutradb
          image: sutradb:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: sutradb-config
          ports:
            - name: grpc
              containerPort: 50051
              protocol: TCP
            - name: http-rest
              containerPort: 8765
              protocol: TCP
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "4000m"
              memory: "4Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8765
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8765
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 2
          volumeMounts:
            - name: sutra-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: sutra-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi

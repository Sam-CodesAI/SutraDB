apiVersion: v1
kind: ConfigMap
metadata:
  name: sutradb-config
  namespace: sutradb
  labels:
    app.kubernetes.io/name: sutradb
data:
  SUTRA_MODE: "all"
  SUTRA_HOST: "0.0.0.0"
  SUTRA_GRPC_PORT: "50051"
  SUTRA_REST_PORT: "8765"
  SUTRA_DATA_DIR: "/data"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

apiVersion: v1
kind: Service
metadata:
  name: sutradb-service
  namespace: sutradb
  labels:
    app.kubernetes.io/name: sutradb
spec:
  type: ClusterIP
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
      protocol: TCP
    - name: http-rest
      port: 8765
      targetPort: 8765
      protocol: TCP
  selector:
    app.kubernetes.io/name: sutradb
---
apiVersion: v1
kind: Service
metadata:
  name: sutradb-headless
  namespace: sutradb
  labels:
    app.kubernetes.io/name: sutradb
spec:
  clusterIP: None
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
      protocol: TCP
    - name: http-rest
      port: 8765
      targetPort: 8765
      protocol: TCP
  selector:
    app.kubernetes.io/name: sutradb

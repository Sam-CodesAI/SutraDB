<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SutraSearch Playground</title>
    <style>
        :root {
            --bg-color: #0a0a0f;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.1);
            --font-family: system-ui, -apple-system, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-family);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        /* Hero Section */
        header { text-align: center; margin-top: 2rem; }
        
        h1 {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            display: inline-block;
        }

        .subtitle { color: var(--text-muted); font-size: 1.2rem; }

        /* Stats Bar */
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 2rem;
            flex-wrap: wrap;
            padding: 1rem;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 1rem;
            backdrop-filter: blur(10px);
        }
        .stat-item { text-align: center; }
        .stat-value { font-size: 1.5rem; font-weight: bold; color: var(--accent-blue); }
        .stat-label { font-size: 0.875rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }

        /* Search Area */
        .search-container { position: relative; display: flex; flex-direction: column; gap: 1rem; }
        
        @keyframes glow {
            0% { box-shadow: 0 0 10px rgba(59, 130, 246, 0.2); }
            50% { box-shadow: 0 0 20px rgba(139, 92, 246, 0.4); }
            100% { box-shadow: 0 0 10px rgba(59, 130, 246, 0.2); }
        }

        input[type="text"] {
            width: 100%;
            padding: 1.5rem;
            font-size: 1.25rem;
            border-radius: 1rem;
            border: 2px solid var(--card-border);
            background: rgba(0, 0, 0, 0.5);
            color: white;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            border-color: var(--accent-purple);
            animation: glow 3s infinite;
        }

        .controls { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }

        .modes { display: flex; gap: 0.5rem; }
        
        .mode-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 0.5rem 1.5rem;
            border-radius: 9999px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }
        .mode-btn:hover { background: rgba(255, 255, 255, 0.1); }
        .mode-btn.active {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
        }

        select {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            outline: none;
            cursor: pointer;
        }
        select option { background: var(--bg-color); }

        .timing { color: var(--text-muted); font-size: 0.9rem; }

        /* Results Area */
        .results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
            position: relative;
            min-height: 200px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 1rem;
            padding: 1.5rem;
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            gap: 1rem;
            animation: fadeIn 0.4s ease-out backwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card:hover { border-color: rgba(255, 255, 255, 0.2); transform: translateY(-2px); transition: all 0.2s; }

        .card-header { display: flex; justify-content: space-between; align-items: start; gap: 1rem; }
        .badges { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .badge {
            font-size: 0.75rem;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .badge.category { background: rgba(139, 92, 246, 0.2); color: #c4b5fd; border: 1px solid rgba(139, 92, 246, 0.3); }
        .badge.difficulty { background: rgba(59, 130, 246, 0.2); color: #93c5fd; border: 1px solid rgba(59, 130, 246, 0.3); }
        .badge.tag { background: rgba(255, 255, 255, 0.05); color: var(--text-muted); }

        .score-overall {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent-blue);
            text-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }

        .card-text { font-size: 1rem; line-height: 1.5; color: #d1d5db; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }

        /* Score Bar */
        .score-bar-container { display: flex; flex-direction: column; gap: 0.25rem; margin-top: auto; }
        .score-bar-labels { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-muted); }
        .score-bar {
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            display: flex;
            overflow: hidden;
        }
        .score-dense { background: var(--accent-purple); }
        .score-bm25 { background: var(--accent-blue); }

        /* Empty & Loading */
        .empty-state, .loading-state {
            grid-column: 1 / -1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4rem 2rem;
            text-align: center;
            color: var(--text-muted);
        }
        .empty-icon { font-size: 4rem; margin-bottom: 1rem; opacity: 0.5; }

        /* Skeleton */
        .skeleton {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 1rem;
            padding: 1.5rem;
            min-height: 200px;
            position: relative;
            overflow: hidden;
        }
        .skeleton::after {
            content: '';
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            transform: translateX(-100%);
            background-image: linear-gradient(
                90deg,
                rgba(255, 255, 255, 0) 0,
                rgba(255, 255, 255, 0.05) 20%,
                rgba(255, 255, 255, 0.05) 60%,
                rgba(255, 255, 255, 0)
            );
            animation: shimmer 2s infinite;
        }
        @keyframes shimmer { 100% { transform: translateX(100%); } }

        /* Footer */
        footer {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
            font-size: 0.875rem;
            border-top: 1px solid var(--card-border);
            margin-top: auto;
        }

        @media (max-width: 768px) {
            h1 { font-size: 2rem; }
            .controls { flex-direction: column; align-items: stretch; }
            .modes { justify-content: center; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚡ SutraSearch Playground</h1>
            <p class="subtitle">Hybrid Vector + BM25 Semantic Search powered by SutraDB</p>
        </header>

        <div class="stats-bar" id="statsBar">
            <div class="stat-item"><div class="stat-value" id="statDocs">-</div><div class="stat-label">Documents</div></div>
            <div class="stat-item"><div class="stat-value" id="statDim">-</div><div class="stat-label">Dimensions</div></div>
            <div class="stat-item"><div class="stat-value" id="statMetric">-</div><div class="stat-label">Metric</div></div>
        </div>

        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search across 50+ tech concepts..." autocomplete="off">
            <div class="controls">
                <div class="modes">
                    <button class="mode-btn active" data-mode="hybrid">Hybrid</button>
                    <button class="mode-btn" data-mode="text">Text Only</button>
                    <button class="mode-btn" data-mode="vector">Vector Only</button>
                </div>
                <select id="categoryFilter">
                    <option value="">All Categories</option>
                </select>
                <div class="timing" id="timingDisplay">Ready</div>
            </div>
        </div>

        <div class="results" id="resultsArea">
            <div class="empty-state">
                <div class="empty-icon">🔍</div>
                <h3>Start typing to search</h3>
                <p>Results will appear here instantly</p>
            </div>
        </div>
    </div>

    <footer>
        Built with SutraDB v2.0 • Zero Dependencies • Sub-millisecond Latency
    </footer>

    <script>
        const API_BASE = '/api';
        
        // DOM Elements
        const searchInput = document.getElementById('searchInput');
        const modeBtns = document.querySelectorAll('.mode-btn');
        const categoryFilter = document.getElementById('categoryFilter');
        const resultsArea = document.getElementById('resultsArea');
        const timingDisplay = document.getElementById('timingDisplay');
        
        let currentMode = 'hybrid';
        let debounceTimer = null;
        let searchAbortController = null;

        // Initialize
        async function init() {
            try {
                const res = await fetch(`${API_BASE}/stats`);
                if (!res.ok) throw new Error('Failed to fetch stats');
                const data = await res.json();
                
                // Update stats
                document.getElementById('statDocs').textContent = data.total_documents?.toLocaleString() || '-';
                
                if (data.collections && data.collections.length > 0) {
                    const col = data.collections[0];
                    document.getElementById('statDim').textContent = col.dimension || '-';
                    document.getElementById('statMetric').textContent = col.metric || '-';
                }

                // Populate categories
                if (data.categories) {
                    data.categories.forEach(cat => {
                        const opt = document.createElement('option');
                        opt.value = cat;
                        opt.textContent = cat.charAt(0).toUpperCase() + cat.slice(1);
                        categoryFilter.appendChild(opt);
                    });
                }
            } catch (err) {
                console.error('Initialization error:', err);
            }
        }

        // Search logic
        async function performSearch() {
            const query = searchInput.value.trim();
            const category = categoryFilter.value;
            
            if (!query) {
                resultsArea.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">🔍</div>
                        <h3>Start typing to search</h3>
                        <p>Results will appear here instantly</p>
                    </div>`;
                timingDisplay.textContent = 'Ready';
                return;
            }

            // Show loading
            resultsArea.innerHTML = Array(6).fill('<div class="skeleton"></div>').join('');
            timingDisplay.textContent = 'Searching...';

            if (searchAbortController) searchAbortController.abort();
            searchAbortController = new AbortController();

            try {
                const startTime = performance.now();
                const res = await fetch(`${API_BASE}/search`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text: query,
                        mode: currentMode,
                        category: category,
                        top_k: 12
                    }),
                    signal: searchAbortController.signal
                });

                if (!res.ok) throw new Error('Search failed');
                const data = await res.json();
                
                const clientTimeMs = performance.now() - startTime;
                const serverTimeMs = data.query_time_ms || 0;
                
                timingDisplay.textContent = `${data.results?.length || 0} results in ${serverTimeMs.toFixed(2)}ms (Client: ${clientTimeMs.toFixed(2)}ms)`;
                
                renderResults(data.results || []);
            } catch (err) {
                if (err.name === 'AbortError') return;
                console.error('Search error:', err);
                resultsArea.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">⚠️</div>
                        <h3>Error performing search</h3>
                        <p>${err.message}</p>
                    </div>`;
                timingDisplay.textContent = 'Error';
            }
        }

        function renderResults(results) {
            if (results.length === 0) {
                resultsArea.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">👻</div>
                        <h3>No results found</h3>
                        <p>Try adjusting your search terms or filters</p>
                    </div>`;
                return;
            }

            resultsArea.innerHTML = results.map((r, i) => {
                const meta = r.metadata || {};
                const tags = meta.tags || [];
                const ds = r.dense_score || 0;
                const bs = r.bm25_score || 0;
                const totalScore = ds + bs;
                
                // Calculate percentages for the bar, handle 0 total
                const dsPct = totalScore > 0 ? (ds / totalScore) * 100 : 0;
                const bsPct = totalScore > 0 ? (bs / totalScore) * 100 : 0;

                return `
                    <div class="card" style="animation-delay: ${i * 0.05}s">
                        <div class="card-header">
                            <div class="badges">
                                ${meta.category ? `<span class="badge category">${meta.category}</span>` : ''}
                                ${meta.difficulty ? `<span class="badge difficulty">${meta.difficulty}</span>` : ''}
                            </div>
                            <div class="score-overall">${(r.score || 0).toFixed(4)}</div>
                        </div>
                        <div class="card-text">${highlight(r.text, searchInput.value)}</div>
                        <div class="badges">
                            ${tags.map(t => `<span class="badge tag">#${t}</span>`).join('')}
                        </div>
                        <div class="score-bar-container">
                            <div class="score-bar-labels">
                                <span>Dense: ${ds.toFixed(3)}</span>
                                <span>BM25: ${bs.toFixed(3)}</span>
                            </div>
                            <div class="score-bar">
                                <div class="score-dense" style="width: ${dsPct}%"></div>
                                <div class="score-bm25" style="width: ${bsPct}%"></div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Simple highlighter
        function highlight(text, query) {
            if (!text || !query) return text;
            const terms = query.trim().split(/\s+/).filter(t => t.length > 2);
            if (terms.length === 0) return text;
            
            let highlighted = text;
            terms.forEach(term => {
                const regex = new RegExp(`(${term})`, 'gi');
                highlighted = highlighted.replace(regex, '<span style="color: var(--accent-blue); font-weight: bold; background: rgba(59, 130, 246, 0.1); border-radius: 2px; padding: 0 2px;">$1</span>');
            });
            return highlighted;
        }

        // Event Listeners
        searchInput.addEventListener('input', () => {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(performSearch, 300);
        });

        modeBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                modeBtns.forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentMode = e.target.dataset.mode;
                performSearch();
            });
        });

        categoryFilter.addEventListener('change', performSearch);

        // Start
        init();
    </script>
</body>
</html>

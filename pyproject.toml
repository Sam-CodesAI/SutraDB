[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "sutradb-core"
version = "3.3.0"
description = "Industrial-grade, zero-dependency hybrid vector search & BM25 lexical engine with HNSW, SQ8, and IVF-Flat indexing in Rust."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Samarth Nimangre", email = "samarthknimangre@gmail.com"}
]
keywords = [
    "vector-database",
    "embeddings",
    "semantic-search",
    "bm25",
    "hybrid-search",
    "hnsw",
    "sq8",
    "rag",
    "llm",
    "machine-learning",
    "rust"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "numpy>=1.24.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pydantic>=2.0.0",
    "httpx>=0.24.0",
    "twine>=7.0.0",
]

[project.urls]
Homepage = "https://sam-codes.vercel.app"
Repository = "https://github.com/Sam-CodesAI/SutraDB"
Documentation = "https://github.com/Sam-CodesAI/SutraDB#readme"
"Bug Tracker" = "https://github.com/Sam-CodesAI/SutraDB/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.24.0",
    "psutil>=5.9.0",
    "maturin>=1.5.0"
]

[project.scripts]
sutradb = "sutradb.server:run_server"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "sutradb._sutradb"
python-source = "."

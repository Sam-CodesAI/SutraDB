[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sutradb-core"
version = "2.1.0"
description = "High-performance, zero-dependency hybrid vector search & BM25 lexical engine with IVF-Flat ANN indexing in pure Python."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Samarth Nimangre", email = "samarthknimangre@gmail.com"}
]

[project.urls]
Homepage = "https://sam-codes.vercel.app"
Repository = "https://github.com/Sam-CodesAI/SutraDB"
Documentation = "https://github.com/Sam-CodesAI/SutraDB#readme"
"Bug Tracker" = "https://github.com/Sam-CodesAI/SutraDB/issues"

keywords = [
    "vector-database",
    "embeddings",
    "semantic-search",
    "bm25",
    "hybrid-search",
    "rag",
    "llm",
    "machine-learning"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "numpy>=1.24.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]

[project.scripts]
sutradb = "sutradb.server:run_server"

[tool.setuptools.packages.find]
where = ["."]
include = ["sutradb*"]

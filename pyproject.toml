[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "sutradb-core"
version = "5.5.0"
description = "Embedded Rust + Python hybrid vector database (HNSW, BM25, WAND sparse, ColBERT) with AVX2/NEON SIMD, 32x BQ quantization, and sub-ms Roaring filtering."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Samarth Nimangre", email = "samarthknimangre@gmail.com"}
]
keywords = [
    "vector-database",
    "hybrid-search",
    "hnsw",
    "bm25",
    "rag",
    "colbert",
    "embeddings",
    "rust",
    "simd",
    "embedded-database",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "numpy>=1.24.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pydantic>=2.0.0",
    "httpx>=0.24.0",
]

[project.urls]
Homepage = "https://pypi.org/project/sutradb-core/"
Repository = "https://github.com/Sam-CodesAI/SutraDB"
Changelog = "https://github.com/Sam-CodesAI/SutraDB/releases"
Issues = "https://github.com/Sam-CodesAI/SutraDB/issues"
Documentation = "https://github.com/Sam-CodesAI/SutraDB#readme"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.24.0",
    "psutil>=5.9.0",
    "maturin>=1.5.0",
    "twine>=7.0.0",
]

[project.scripts]
sutradb = "sutradb.server:run_server"

[tool.maturin]
features = ["python"]
module-name = "sutradb._sutradb"
python-source = "."

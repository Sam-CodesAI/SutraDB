syntax = "proto3";

package sutra;

// ==========================================
// Vector Data Types
// ==========================================

message Vector {
  repeated float values = 1;
}

message SparseVector {
  repeated uint32 indices = 1;
  repeated float values = 2;
}

message MultiVector {
  repeated Vector vectors = 1;
}

message Document {
  string id = 1;
  repeated float vector = 2;
  optional string text = 3;
  optional SparseVector sparse_vector = 4;
  optional string metadata_json = 5;
  optional string namespace = 6;
  optional MultiVector colbert_tokens = 7;
}

// ==========================================
// Query & Search
// ==========================================

message QueryRequest {
  string collection_name = 1;
  repeated float vector = 2;
  optional string text = 3;
  optional SparseVector sparse_vector = 4;
  optional string namespace = 5;
  optional string filter_json = 6;
  uint32 top_k = 7;
  bool hybrid = 8;
  float dense_weight = 9;
  float bm25_weight = 10;
  float sparse_weight = 11;
  bool use_ann = 12;
  optional MultiVector colbert_tokens = 13;
  float colbert_weight = 14;
}

message SearchResult {
  string id = 1;
  float score = 2;
  optional string text = 3;
  optional string metadata_json = 4;
  optional float dense_score = 5;
  optional float bm25_score = 6;
  optional float sparse_score = 7;
  optional string namespace = 8;
  optional float colbert_score = 9;
}

message QueryResponse {
  repeated SearchResult results = 1;
  uint64 latency_micros = 2;
}

message BatchQueryRequest {
  string collection_name = 1;
  repeated QueryRequest queries = 2;
}

message BatchQueryResponse {
  repeated QueryResponse responses = 1;
}

// ==========================================
// Insert & Delete
// ==========================================

message InsertRequest {
  string collection_name = 1;
  repeated Document documents = 2;
}

message InsertResponse {
  uint64 inserted_count = 1;
  bool success = 2;
  string message = 3;
}

message DeleteRequest {
  string collection_name = 1;
  repeated string ids = 2;
}

message DeleteResponse {
  uint64 deleted_count = 1;
  bool success = 2;
}

// ==========================================
// Health & Collection Management
// ==========================================

message HealthRequest {}

message HealthResponse {
  string status = 1;
  string version = 2;
  uint32 collection_count = 3;
  uint64 uptime_seconds = 4;
}

message CreateCollectionRequest {
  string collection_name = 1;
  uint32 dimension = 2;
  string metric = 3; // "cosine", "dot", "euclidean"
  optional string data_dir = 4;
}

message CreateCollectionResponse {
  bool success = 1;
  string message = 2;
}

message DropCollectionRequest {
  string collection_name = 1;
}

message DropCollectionResponse {
  bool success = 1;
}

message ListCollectionsRequest {}

message ListCollectionsResponse {
  repeated string collection_names = 1;
}

message CollectionStatsRequest {
  string collection_name = 1;
}

message CollectionStatsResponse {
  string name = 1;
  uint64 count = 2;
  uint32 dimension = 3;
  string metric = 4;
  bool is_dirty = 5;
  uint64 wal_records = 6;
}

// ==========================================
// Direct Batch Distances Computation
// ==========================================

message BatchDistanceRequest {
  repeated float query_vector = 1;
  // Flattened target matrix (N * dimension)
  repeated float target_vectors = 2;
  uint32 dimension = 3;
  string metric = 4; // "cosine", "dot", "euclidean"
}

message BatchDistanceResponse {
  repeated float scores = 1;
}

// ==========================================
// Sutra gRPC Service
// ==========================================

service SutraService {
  rpc Query(QueryRequest) returns (QueryResponse);
  rpc BatchQuery(BatchQueryRequest) returns (BatchQueryResponse);
  rpc Insert(InsertRequest) returns (InsertResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc CreateCollection(CreateCollectionRequest) returns (CreateCollectionResponse);
  rpc DropCollection(DropCollectionRequest) returns (DropCollectionResponse);
  rpc ListCollections(ListCollectionsRequest) returns (ListCollectionsResponse);
  rpc GetStats(CollectionStatsRequest) returns (CollectionStatsResponse);
  rpc BatchDistances(BatchDistanceRequest) returns (BatchDistanceResponse);
}
